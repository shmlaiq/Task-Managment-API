# Development Docker Compose
# Usage: docker compose -f compose.dev.yaml up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot-reload
      - .:/app
      # Exclude venv (use container's venv)
      - /app/.venv
    environment:
      - DEBUG=true
      - LOG_LEVEL=debug
    restart: on-failure

